name = "neon-path-leaderboard"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "neon-path-leaderboard"
# Run `npx wrangler d1 create neon-path-leaderboard` and paste the printed id here.
database_id = "b6cb0d82-14c8-4efb-9cc6-7322954ae018"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ARENA"
class_name = "Arena"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Arena"]

[vars]
# Web client id from Google Cloud (OAuth). Empty keeps Google sign-in off.
GOOGLE_CLIENT_ID = "970228207998-6kadvce8pgc46nmd0i1p0go111lltl8l.apps.googleusercontent.com"
