name = "neon-path-leaderboard"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[d1_databases]]
binding = "DB"
database_name = "neon-path-leaderboard"
# Run `npx wrangler d1 create neon-path-leaderboard` and paste the printed id here.
database_id = "REPLACE_WITH_D1_ID"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ARENA"
class_name = "Arena"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Lobby", "Arena"]
