<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Zoom is intentionally allowed: WCAG 1.4.4 requires it, and the board
         already handles its own touch gestures with touch-action: none. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./icon-512.png" />
    <title>Neon Path Puzzle · One line, 300 circuits</title>
    <meta name="description" content="Train your brain: connect every node with one continuous line. 300 unique circuits, three attempts per level, daily and weekly challenges. Free to play in your browser." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Neon Path Puzzle" />
    <meta property="og:description" content="One continuous line, 300 circuits. Train your brain." />
    <meta property="og:image" content="https://nrn-world.github.io/NeonPathPuzzle/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Portal SDKs are injected at runtime for the matching build only;
         the plain web/PWA build loads no third-party script. -->
  </head>
  <body>
    <!-- Shown until React mounts, so a slow first load is never a blank screen. -->
    <div id="root"><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f1e;color:#00f3ff;font:800 28px/1 system-ui,sans-serif;letter-spacing:.3em;animation:boot 1.4s ease-in-out infinite alternate">NEON PATH</div></div>
    <style>@keyframes boot{from{opacity:.25}to{opacity:1}}html,body{background:#0a0f1e}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
