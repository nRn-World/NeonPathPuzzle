name: Test and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Privacy policy is in sync with the app
        run: npm run privacy:check

      - name: Validate all levels
        run: npx tsx verify-levels.ts

      - name: Puzzle uniqueness audit
        run: npm run audit:uniqueness

      - name: Build game
        run: npm run build
        env:
          # Set the repository variable once the leaderboard worker is deployed; empty keeps rankings off.
          VITE_LEADERBOARD_URL: ${{ vars.VITE_LEADERBOARD_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: Bundle-size budget
        run: npm run check:bundle

      - name: Prepare Pages fallback files
        if: github.event_name != 'pull_request'
        run: cp dist/public/index.html dist/public/404.html && touch dist/public/.nojekyll

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser E2E — smoke, axe a11y and visual regression (desktop + mobile)
        run: npm run test:e2e

      - name: Keep visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-screenshots
          path: test-results/visual/
          if-no-files-found: ignore
